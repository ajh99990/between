<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>动态背景 · 配方演示</title><link rel="stylesheet" href="./background.css"><link rel="stylesheet" href="./scene.css"><link rel="stylesheet" href="../workbench.css"></head><body class="glass-workbench"><div id="scene"><div id="background"></div><section id="controls" aria-label="背景调整"><label>背景<select id="preset"><option value="ribbon">蓝灰流带</option><option value="mist">青灰雾光</option><option value="ember">琥珀微晕</option><option value="tide">薄雾波面</option></select></label><button id="motion" type="button">开始移动</button><label>背景强度<input id="intensity" type="range" min="0" max="100" value="100"><output id="amount">100%</output></label><button id="overlay" type="button">显示界面</button><button id="at0" type="button">0 秒</button><button id="at8" type="button">8 秒</button><button id="at20" type="button">20 秒</button><button id="lifecycle" type="button">销毁背景</button><button id="clean" type="button">隐藏控制栏</button><output id="status" aria-live="polite">已静止</output></section><div id="content" hidden><aside><strong>项目工作台</strong><p>工作视图</p><button>全部任务</button><button>资料整理</button><p>最近访问</p><span>阶段交付检查</span></aside><main><p class="eyebrow">WORKSPACE</p><h1>把工作，放在同一处</h1><p>让目标、负责人和下一步保持清晰。</p><section class="card"><h2>本周任务</h2><div class="row"><span>整理项目说明</span><small>小组甲</small><em>进行中</em></div><div class="row"><span>核对交付清单</span><small>小组乙</small><em>待审核</em></div><div class="row"><span>复查验收结果</span><small>小组丙</small><em>待开始</em></div></section><section class="editor"><label for="notes">任务说明</label><textarea id="notes" placeholder="补充目标与需要核对的内容…"></textarea><button id="save-note" type="button">保存草稿</button><p id="note-status" role="status">本地内存模拟，刷新后清空。</p></section></main></div></div><script type="module" src="./scene.js"></script></body></html>
