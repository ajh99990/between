<!doctype html>
<html lang="zh-CN"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="color-scheme" content="dark"><title>深色单选 · 交互契约</title><link rel="stylesheet" href="../workbench.css"><style>
body{margin:0;background:#15181d}.select-demo{min-height:100dvh;padding:32px;max-width:960px;margin:auto}.select-demo h1{font-size:22px;font-weight:600}.select-demo h2{font-size:16px;font-weight:500}.select-demo p{color:var(--gw-text-secondary)}.select-demo section{padding:24px;margin:24px 0;border:1px solid var(--gw-border);border-radius:12px;background:rgb(25 29 35 / 68%)}.select-demo label{display:block;margin-bottom:8px}.select-demo .field{max-width:330px}.select-demo .actions{display:flex;flex-wrap:wrap;gap:8px;margin-top:20px}.select-demo output{display:block;white-space:pre-wrap;margin-top:16px;font:13px/1.6 var(--gw-mono);color:var(--gw-text-secondary)}.select-demo input[type=checkbox]{accent-color:#a2bbd0}.select-demo .note{font-size:12px;color:var(--gw-text-muted)}@media(max-width:500px){.select-demo{padding:16px}.select-demo section{padding:16px}}
</style></head><body><main class="glass-workbench select-demo"><h1>深色单选 · 交互契约</h1><p>本页没有请求或存储。组件只呈现值；表单提交与暂缓回传由本页控制器演示。</p>
<section><h2>原生表单桥接</h2><form id="form"><div class="field"><label for="workflow">任务状态 *</label><select id="workflow" name="workflow" required aria-describedby="workflow-help"><option value="">请选择状态</option><option value="draft">待开始</option><option value="blocked" disabled>暂不可用</option><option value="review">待审核</option><option value="done">已完成</option></select><p id="workflow-help" class="note">必填；方向键跳过禁用项。标签和校验均聚焦可见触发器。</p></div><div class="actions"><button class="gw-button gw-button--primary" type="submit">校验并提交</button><button class="gw-button" type="button" id="validity">检查有效性</button><button class="gw-button" type="reset">重置表单</button><button class="gw-button" type="button" id="assign">程序设为审核</button><button class="gw-button" type="button" id="inspect">读取表单值</button></div></form><div class="actions"><button class="gw-button" id="disable">禁用字段</button><button class="gw-button" id="lifecycle">销毁接管</button></div><output id="form-status" role="status">等待操作</output></section>
<section><h2>独立组件：调用方回传</h2><div id="controlled" class="field"></div><div class="actions"><label><input id="defer" type="checkbox">暂不回传新值</label><button class="gw-button" id="commit">回传最近意图</button></div><output id="controlled-status" role="status"></output></section>
<p class="note">展开列表须保持深色；当前选择有蓝灰底和勾号。Escape 取消浏览；Tab 关闭并移动焦点。原生 multiple、size 列表及 optgroup 不属于本组件支持范围。</p></main><script type="module" src="./select-demo.js"></script></body></html>
