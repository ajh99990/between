<!doctype html><html lang="zh-CN"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'self'; style-src 'self'; img-src 'self' data:; font-src 'self'; connect-src 'none'; object-src 'none'; base-uri 'none'; frame-src 'none'"><title>阿岚 · 线上相处</title><link rel="stylesheet" href="style.css"></head><body>
<aside class="rail"><div class="lights"><button class="close" aria-label="关闭窗口"></button><button class="min" aria-label="最小化"></button><button class="max" aria-label="切换最大化"></button></div><div class="avatar own" aria-label="本人头像">你</div><nav><button data-icon="chat" class="selected" aria-label="聊天" title="聊天"></button><button data-icon="contacts" aria-label="通讯录" title="通讯录"></button><button data-icon="cube" aria-label="小程序" title="小程序"></button><button data-icon="folder" aria-label="文件" title="文件"></button></nav><div class="rail-bottom"><button data-icon="phone" aria-label="设备" title="设备"></button><button data-icon="menu" id="settings" aria-label="设置" title="设置"></button></div></aside>
<aside class="list"><header class="searchbar"><label><span class="search-icon"></span><input id="search" placeholder="搜索" aria-label="搜索聊天"></label><button class="add" aria-label="新增聊天">＋</button></header><div id="contacts"></div></aside>
<main><header class="chat-header"><strong id="title">阿岚</strong><button data-icon="more" id="details" aria-label="聊天详情" title="聊天详情"></button></header><section id="messages" class="messages" aria-label="聊天记录" aria-live="polite"></section><section class="composer"><div class="toolbar"><div><button data-icon="emoji" id="emoji" aria-label="表情" title="表情"></button><button data-icon="folder" aria-label="发送文件" title="发送文件"></button><button data-icon="scissors" aria-label="截图" title="截图"></button><button data-icon="bubble" aria-label="聊天记录" title="聊天记录"></button></div><div><button data-icon="call" aria-label="语音通话" title="语音通话"></button><button data-icon="video" aria-label="视频通话" title="视频通话"></button></div></div><textarea id="input" aria-label="输入消息" maxlength="8000"></textarea><div class="composer-foot"><span id="hint"></span><button id="send">发送</button></div></section></main>
<dialog id="dialog"><div id="dialog-content"></div><button id="dialog-close">关闭</button></dialog><script src="app.js"></script></body></html>
