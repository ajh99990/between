<!doctype html><html lang="zh-CN"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Between · 留一点空间</title><link rel="stylesheet" href="/style.css"><body><aside><a class="brand" href="/">between<span>留一点空间</span></a><button id="new">＋ 开始新的对话</button><h3>最近的对话</h3><nav id="history"></nav><footer>独立角色引擎 · 本机研究版<br>你的对话保存在当前服务的数据目录</footer></aside><main><header><div><small>一段属于你的对话</small><h1 id="title">今天，想和谁聊聊？</h1></div><span id="connection" class="badge">正在连接</span></header><div id="notice" role="status"></div><section id="welcome"><p class="intro">不必准备好故事。<br>从一句问候开始就好。</p><div id="roles" class="cards"></div><p class="muted">米拉与林间为合成素材。社区角色来源：Foreverse Team，CC BY 4.0；原始授权与改动说明见后台及源码。</p></section><section id="messages" aria-live="polite"></section><form id="composer" hidden><label for="input" class="sr">消息</label><textarea id="input" placeholder="写下你想说的话…" rows="3"></textarea><div class="toolbar"><label>附件<input id="file" type="file" accept="image/png,image/jpeg,image/webp,audio/wav"></label><label><input id="speak" type="checkbox">朗读回复</label><button type="button" id="picture">生成图片</button><button type="button" id="retry" hidden>重试</button><button type="button" id="stop" hidden>停止生成</button><button class="primary" id="send">发送 ↑</button></div><small id="attachment"></small></form></main><dialog id="setup"><form method="dialog"><button class="close" aria-label="关闭">×</button></form><h2 id="setup-title">开始对话</h2><form id="create"><label>你的称呼<input name="userName" value="旅人" maxlength="40"></label><label>你的身份与偏好<textarea name="persona" rows="3" maxlength="3000"></textarea></label><label>角色设定（仅此新会话）<textarea name="characterDescription" rows="3" maxlength="5000" placeholder="留空使用管理员设定"></textarea></label><button class="primary">进入对话</button></form></dialog><script type="module" src="/app.js"></script></body></html>
