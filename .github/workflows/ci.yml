name: current-product
on: [push, pull_request]
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-22.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .node-version
          cache: npm
      - run: npm install --global npm@11.6.1 --ignore-scripts --no-audit --no-fund
      - run: npm ci
      - run: npm run check
      - run: npm exec --workspace @between/admin -- playwright install --with-deps chromium
      - run: npm run test:browser
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: isolated-browser-evidence
          path: artifacts/browser
          if-no-files-found: ignore
# Offline fixtures and temporary loopback services only; no credentials,
# real model inference, deployment, or dependency lifecycle scripts.
