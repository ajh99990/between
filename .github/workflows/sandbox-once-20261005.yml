name: one-off-sandbox-verification-20261005
on:
  push:
    branches: [main]
    paths: [.github/workflows/sandbox-once-20261005.yml]
permissions:
  contents: read
jobs:
  verify:
    if: >-
      github.repository == 'ajh99990/between' &&
      github.event.before == '4064973b46544cd2ee88168f9b79369fe1e3f2f3' &&
      github.event.head_commit.message == 'ci: one-off authorized Electron sandbox verification 20261005' &&
      github.run_attempt == 1
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          ref: 4064973b46544cd2ee88168f9b79369fe1e3f2f3
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 24.19.0
      - name: Verify immutable source and official Electron helper
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = 4064973b46544cd2ee88168f9b79369fe1e3f2f3
          printf '%s\n' 'bd31cdda5fba771bda5d3ed4687cbe1c641de1d766bec64c9dd791b8ea05b93c  tests/packaging/desktop-install.test.mjs' | sha256sum --check --strict
          official="$RUNNER_TEMP/electron-official-44.5.1"
          mkdir "$official"
          base=https://github.com/electron/electron/releases/download/v44.5.1
          curl --proto '=https' --proto-redir '=https' --tlsv1.2 --fail --location --retry 2 "$base/SHASUMS256.txt" -o "$official/SHASUMS256.txt"
          curl --proto '=https' --proto-redir '=https' --tlsv1.2 --fail --location --retry 2 "$base/electron-v44.5.1-linux-x64.zip" -o "$official/electron-v44.5.1-linux-x64.zip"
          python3 - "$official" <<'PY'
          import hashlib, pathlib, re, sys, zipfile
          root = pathlib.Path(sys.argv[1])
          name = 'electron-v44.5.1-linux-x64.zip'
          entries = re.findall(r'^([0-9a-fA-F]{64})\s+\*?' + re.escape(name) + r'\s*$', (root / 'SHASUMS256.txt').read_text(), re.M)
          assert len(entries) == 1, 'Official checksum entry must be unique'
          digest = hashlib.sha256((root / name).read_bytes()).hexdigest()
          assert digest == entries[0].lower(), 'Official Electron archive checksum mismatch'
          with zipfile.ZipFile(root / name) as archive:
              matches = [item for item in archive.infolist() if item.filename == 'chrome-sandbox']
              assert len(matches) == 1 and not matches[0].is_dir(), 'Expected one sandbox helper'
              helper = archive.read(matches[0])
          assert helper[:4] == b'\x7fELF', 'Sandbox helper must be an ELF binary'
          helper_sha = hashlib.sha256(helper).hexdigest()
          print('Official Electron archive SHA256:', digest)
          print('Official chrome-sandbox SHA256:', helper_sha)
          import os
          with open(os.environ['GITHUB_ENV'], 'a') as env:
              env.write('BETWEEN_ONCE_SANDBOX_SHA256=' + helper_sha + '\n')
          PY
      - run: corepack enable && corepack prepare pnpm@11.19.0 --activate
      - run: pnpm install --frozen-lockfile
      - name: Add setup-only hook to the isolated desktop installation test
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import hashlib, pathlib
          path = pathlib.Path('tests/packaging/desktop-install.test.mjs')
          original = path.read_bytes()
          assert hashlib.sha256(original).hexdigest() == 'bd31cdda5fba771bda5d3ed4687cbe1c641de1d766bec64c9dd791b8ea05b93c'
          anchor = "  const report = { installMode: offline ?"
          hook = """  // One authorized CI run only: preserve all assertions and sandboxing.
            assert.equal(process.platform, 'linux'); assert.equal(process.arch, 'x64');
            const sandbox = path.join(artifact, 'node_modules/electron/dist/chrome-sandbox');
            assert.equal(await fs.realpath(sandbox), sandbox, 'Sandbox path must not contain symlinks');
            const sandboxInfo = await fs.lstat(sandbox);
            assert.ok(sandboxInfo.isFile()); assert.equal(sandboxInfo.nlink, 1);
            const installedElectron = JSON.parse(await fs.readFile(path.join(artifact, 'node_modules/electron/package.json')));
            assert.equal(installedElectron.version, '44.5.1');
            assert.match(process.env.BETWEEN_ONCE_SANDBOX_SHA256 || '', /^[0-9a-f]{64}$/);
            const { createHash } = await import('node:crypto');
            const helperDigest = async () => createHash('sha256').update(await fs.readFile(sandbox)).digest('hex');
            assert.equal(await helperDigest(), process.env.BETWEEN_ONCE_SANDBOX_SHA256, 'Installed helper must match verified official Electron archive');
            await exec('sudo', ['-n', 'chown', 'root:root', '--', sandbox]);
            await exec('sudo', ['-n', 'chmod', '4755', '--', sandbox]);
            const configuredSandbox = await fs.stat(sandbox);
            assert.equal(configuredSandbox.uid, 0); assert.equal(configuredSandbox.gid, 0);
            assert.equal(configuredSandbox.mode & 0o7777, 0o4755);
            assert.equal(await helperDigest(), process.env.BETWEEN_ONCE_SANDBOX_SHA256);
            t.diagnostic('Verified official Electron 44.5.1 helper: root:root mode 4755; sandbox remains enabled');
          """
          source = original.decode()
          assert source.count(anchor) == 1
          path.write_text(source.replace(anchor, hook + anchor))
          assert path.read_text().replace(hook, '', 1) == source
          PY
          git diff --check
          git diff -- tests/packaging/desktop-install.test.mjs
      - name: Full original release test phases with one-off sandbox setup
        run: pnpm test:release
      - name: Validate relationship Skills
        run: pnpm skills:check
# No model/provider secrets, no deployment, no no-sandbox flags, no AppArmor changes.
# This workflow cannot repeat on later pushes or rerun attempts. Remove after the result.
